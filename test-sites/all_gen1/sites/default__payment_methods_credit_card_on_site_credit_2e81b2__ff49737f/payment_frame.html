<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Secure Card Entry
  </title>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body class="payment-frame-body">
  <div class="payment-frame-container">
   <p class="payment-frame-badge">
    🔒 Secure payment by YourTrustedPayments
   </p>
   <form action="#" method="GET">
    <div class="form-group">
     <label for="cc_name">
      Name on Card
     </label>
     <input class="form-control" id="cc_name" name="cc_name" required="" type="text"/>
    </div>
    <div class="form-group">
     <label for="cc_number">
      Card Number
     </label>
     <input class="form-control" id="cc_number" name="cc_number" required="" type="text"/>
    </div>
    <div class="row">
     <div class="form-group">
      <label for="cc_exp">
       Expiry (MM/YY)
      </label>
      <input class="form-control" id="cc_exp" name="cc_exp" required="" type="text"/>
     </div>
     <div class="form-group">
      <label for="cc_cvc">
       CVC
      </label>
      <input class="form-control" id="cc_cvc" name="cc_cvc" required="" type="text"/>
     </div>
    </div>
   </form>
  </div>
  <script src="script.js">
  </script>
 </body>
</html>

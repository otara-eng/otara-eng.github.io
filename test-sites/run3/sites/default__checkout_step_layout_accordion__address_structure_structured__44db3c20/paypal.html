<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   PayPal Checkout
  </title>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body class="wallet-body">
  <header class="wallet-header">
   <h1>
    PayPal
   </h1>
   <p>
    Log in to approve your payment to CozyBear Boutique.
   </p>
  </header>
  <main class="wallet-container">
   <form action="order_confirmation.html" method="GET">
    <div class="form-group">
     <input class="form-control" id="paypal_email" name="paypal_email" required="" type="email"/>
     <label class="floating-label" for="paypal_email">
      Email
     </label>
    </div>
    <div class="form-group">
     <input class="form-control" id="paypal_password" name="paypal_password" required="" type="password"/>
     <label class="floating-label" for="paypal_password">
      Password
     </label>
    </div>
    <button class="btn" id="paypal-pay-now" type="submit">
     Log In and Pay
    </button>
   </form>
   <p class="wallet-cancel">
    <a href="checkout.html">
     Cancel and return to the store
    </a>
   </p>
  </main>
  <script src="script.js">
  </script>
 </body>
</html>
